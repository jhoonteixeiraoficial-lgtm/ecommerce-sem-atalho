<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap');
  </style>
  
  <!-- Concept 1: Clean Horizontal -->
  <!-- "ECOMMERCE" white + "SEM ATALHO" gold, same line -->
  
  <text x="0" y="42" font-family="'Inter','Helvetica Neue',Arial,sans-serif" 
        font-size="38" font-weight="700" fill="#ffffff" letter-spacing="5">ECOMMERCE</text>
  
  <text x="310" y="42" font-family="'Inter','Helvetica Neue',Arial,sans-serif" 
        font-size="38" font-weight="700" fill="#c8a44e" letter-spacing="3">SEM</text>
  
  <text x="0" y="82" font-family="'Inter','Helvetica Neue',Arial,sans-serif" 
        font-size="38" font-weight="700" fill="#c8a44e" letter-spacing="3">ATALHO</text>
</svg>
